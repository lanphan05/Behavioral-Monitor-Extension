services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-behavioral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-behavioral}
      POSTGRES_DB: ${POSTGRES_DB:-behavioral_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-behavioral} -d ${POSTGRES_DB:-behavioral_monitor}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/app/artifacts}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN}
      HOST: 0.0.0.0
      PORT: 8765
    volumes:
      - ./backend/artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
